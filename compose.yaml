services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stock
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes: ["stock-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    ports: ["127.0.0.1:8082:8080"]
    environment:
      API_KEY: ${API_KEY:?Defina API_KEY}
      ConnectionStrings__Stock: Host=db;Database=stock;Username=stock;Password=${DB_PASSWORD}
    depends_on:
      db: {condition: service_healthy}
volumes:
  stock-data:
